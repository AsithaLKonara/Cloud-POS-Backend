# ==============================================================================
# XONIT SPACE - Multi-Project Subdomain Architecture for Single VPS
# 4 vCPU | 8 GB RAM | 100 GB SSD
# ==============================================================================
# Projects hosted on this VPS:
# 1. XONIT Space Platform:
#    - Web (Landing / Corporate):      https://xonitspace.com  -> Port 3001
#    - Core Dashboard / Backend:       https://dashboard.xonitspace.com -> Port 5001
#
# 2. XONIT ERP + POS Platform:
#    - ERP + POS Web (Frontend):       https://erp.xonitspace.com (or pos.xonitspace.com) -> Port 3000
#    - ERP + POS Engine (Backend API): https://api.xonitspace.com -> Port 5000
# ==============================================================================

# Rate Limiting Zones
limit_req_zone $binary_remote_addr zone=global_req_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=auth_req_limit:10m rate=5r/s;

# ------------------------------------------------------------------------------
# Upstream Definitions
# ------------------------------------------------------------------------------
upstream xonit_web_upstream {
    server 127.0.0.1:3001;
    keepalive 32;
}

upstream xonit_dashboard_backend_upstream {
    server 127.0.0.1:5001;
    keepalive 32;
}

upstream pos_frontend_upstream {
    server 127.0.0.1:3000;
    keepalive 32;
}

upstream pos_backend_upstream {
    server 127.0.0.1:5000;
    keepalive 64;
}

# ------------------------------------------------------------------------------
# Common Gzip & Buffer Template
# ------------------------------------------------------------------------------
# Buffer tuning to prevent 502 with large JWT tokens / auth cookies
# (Included inside server blocks)

# ------------------------------------------------------------------------------
# 1. HTTP -> HTTPS Global Redirection
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name xonitspace.com www.xonitspace.com dashboard.xonitspace.com erp.xonitspace.com pos.xonitspace.com api.xonitspace.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------------------
# 2. PROJECT 1 (WEB): xonitspace.com & www.xonitspace.com
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name xonitspace.com www.xonitspace.com;

    ssl_certificate /etc/letsencrypt/live/xonitspace.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xonitspace.com/privkey.pem;

    client_max_body_size 25M;
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /_next/static/ {
        proxy_pass http://xonit_web_upstream;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location / {
        proxy_pass http://xonit_web_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# ------------------------------------------------------------------------------
# 3. PROJECT 1 (DASHBOARD/BACKEND): dashboard.xonitspace.com
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dashboard.xonitspace.com;

    ssl_certificate /etc/letsencrypt/live/xonitspace.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xonitspace.com/privkey.pem;

    client_max_body_size 50M;
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location / {
        proxy_pass http://xonit_dashboard_backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# ------------------------------------------------------------------------------
# 4. PROJECT 2 (ERP + POS WEB FRONTEND): erp.xonitspace.com & pos.xonitspace.com
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name erp.xonitspace.com pos.xonitspace.com;

    ssl_certificate /etc/letsencrypt/live/xonitspace.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xonitspace.com/privkey.pem;

    client_max_body_size 50M;
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Static assets cache
    location /_next/static/ {
        proxy_pass http://pos_frontend_upstream;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Frontend routes
    location / {
        proxy_pass http://pos_frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# ------------------------------------------------------------------------------
# 5. PROJECT 2 (ERP + POS ENGINE / BACKEND API): api.xonitspace.com
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.xonitspace.com;

    ssl_certificate /etc/letsencrypt/live/xonitspace.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xonitspace.com/privkey.pem;

    client_max_body_size 50M;
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Health check probe
    location = /health {
        proxy_pass http://pos_backend_upstream/health;
        access_log off;
    }

    # Strict Auth Rate Limiting
    location /api/v1/auth/ {
        limit_req zone=auth_req_limit burst=10 nodelay;
        proxy_pass http://pos_backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # General API Routes
    location / {
        limit_req zone=global_req_limit burst=50 nodelay;
        proxy_pass http://pos_backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
    }

    # WebSockets (Socket.io)
    location /socket.io/ {
        proxy_pass http://pos_backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
    }
}
