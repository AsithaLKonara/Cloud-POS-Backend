# ==============================================================================
# XONIT POS & ERP - VPS Direct IP Nginx Configuration (HTTP Only)
# Use this configuration if you haven't pointed a custom domain name yet!
# ==============================================================================

upstream frontend_upstream {
    server 127.0.0.1:3000;
    keepalive 64;
}

upstream backend_upstream {
    server 127.0.0.1:5000;
    keepalive 64;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 50M;

    # Performance: Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml font/woff2;

    # Buffer tuning
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Backend Health Check
    location = /health {
        proxy_pass http://backend_upstream/health;
        access_log off;
    }

    # Backend API Routing
    location /api/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
    }

    # WebSockets (Socket.io)
    location /socket.io/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Next.js Static Optimization Cache
    location /_next/static/ {
        proxy_pass http://frontend_upstream;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Next.js Frontend
    location / {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}
